[pytest]
testpaths = .
norecursedirs = fixtures .* __pycache__ .tmp
addopts = -p no:cacheprovider
# Isolated config for the NF20 benchmark-harness tests only.  Run from the
# repository root as:
#   python -B -m pytest tests/benchmarks -p no:cacheprovider --confcutdir=tests/benchmarks
# (the shared tests/conftest.py above this directory is intentionally not
# loaded; this suite never collects the rest of the repository)
