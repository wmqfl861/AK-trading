[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ak-trading"
version = "0.1.0"
description = "Domestic futures quant scaffolding on TqSdk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tqsdk==3.10.1",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
postgres = [
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "postgres: requires an isolated PostgreSQL database",
]
